name: Publish

on:
  release:
    types: [ published ]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-tests:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build --configuration Release

      - name: Run unit tests
        run: dotnet test --no-build --configuration Release /p:CollectCoverage=true /p:CoverletOutputFormat=lcov

      - name: Publish coverage report to Coveralls
        uses: coverallsapp/github-action@v2.2.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ./Bynder/Test/coverage.info
        continue-on-error: true

  publish-nuget:
    name: Release
    runs-on: ubuntu-22.04
    needs: build-tests
    permissions:
      contents: read
      id-token: write # required for NuGet trusted publishing (OIDC)

    steps:
      - uses: actions/checkout@v6
      - name: Setup .NET Core
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install dependencies
        run: dotnet restore

      - name: Pack
        run: dotnet pack Bynder/Sdk/Bynder.Sdk.csproj --configuration Release --no-restore --output ./artifacts

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_TRUSTED_PUBLISHING_USER }}

      - name: Publish to NuGet
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
